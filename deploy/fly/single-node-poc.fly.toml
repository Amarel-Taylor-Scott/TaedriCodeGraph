# Explicit single-Machine proof deployment. This is not the production S1 topology:
# SQLite and the local graph store remain on one attached volume, and API plus worker
# intentionally share one process. See deploy/fly/README.md before using this config.

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TAEDRI_CONTROL_DB = "/data/control.sqlite"
  TAEDRI_SOURCE_ROOT = "/app"
  TAEDRI_HOST = "0.0.0.0"
  TAEDRI_PORT = "8000"

[processes]
  app = "poc --control /data/control.sqlite --source-root /app --host 0.0.0.0 --port 8000"

[[mounts]]
  source = "taedri_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

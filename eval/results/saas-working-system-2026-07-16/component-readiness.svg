  <line x1="58" y1="344" x2="902" y2="344" stroke="#2a3c55"/>
  <text x="58" y="376" fill="#c7d3e5" font-family="system-ui,sans-serif" font-size="15">Working is scope-qualified; hosted CI, managed stores, OIDC, and real-model efficacy remain explicit gates.</text>

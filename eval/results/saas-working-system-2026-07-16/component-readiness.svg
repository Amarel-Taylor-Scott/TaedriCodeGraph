      <stop offset="0" stop-color="#071525"/>
      <stop offset="1" stop-color="#111d33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="960" height="430" rx="24" fill="url(#bg)"/>
  <text x="58" y="58" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="28" font-weight="700">Component readiness · 2026-07-16</text>
  <text x="58" y="88" fill="#9fb0c8" font-family="system-ui,sans-serif" font-size="15">Scoped acceptance status — 26 declared components</text>
  <g transform="translate(58 130)" font-family="system-ui,sans-serif" filter="url(#shadow)">
    <rect width="844" height="54" rx="12" fill="#13243b"/>
    <rect width="552" height="54" rx="12" fill="#21c58b"/>
    <rect x="552" width="195" height="54" fill="#f2b84b"/>
    <rect x="747" width="65" height="54" fill="#5fa8ff"/>
    <rect x="812" width="32" height="54" rx="12" fill="#a68bfa"/>
    <text x="276" y="34" text-anchor="middle" fill="#04281d" font-size="17" font-weight="800">17 working</text>
    <text x="649" y="34" text-anchor="middle" fill="#362400" font-size="16" font-weight="800">6 partial</text>
  </g>
  <g transform="translate(58 228)" font-family="system-ui,sans-serif">
    <g transform="translate(0 0)">
      <circle cx="10" cy="10" r="10" fill="#21c58b"/><text x="32" y="16" fill="#e6edf7" font-size="16">Working</text><text x="220" y="16" fill="#fff" font-size="22" font-weight="800">17</text>
    </g>
    <g transform="translate(0 45)">
      <circle cx="10" cy="10" r="10" fill="#f2b84b"/><text x="32" y="16" fill="#e6edf7" font-size="16">Partial</text><text x="220" y="16" fill="#fff" font-size="22" font-weight="800">6</text>
    </g>

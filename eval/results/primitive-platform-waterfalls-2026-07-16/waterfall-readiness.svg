    <line class="line" x1="480" y1="36" x2="884" y2="36"/><g transform="translate(500 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">1</text></g><g transform="translate(590 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">2</text></g><g transform="translate(680 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">3</text></g><g transform="translate(770 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">4</text></g><g transform="translate(860 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">5</text></g>
  </g>

  <g transform="translate(54 718)" font-family="system-ui,sans-serif"><circle cx="8" cy="0" r="8" fill="#26cf91"/><text x="24" y="5" fill="#c9d7e8" font-size="13">executable evidence</text><circle cx="190" cy="0" r="8" fill="#f3bc51"/><text x="206" y="5" fill="#c9d7e8" font-size="13">external gate</text><text x="1092" y="5" text-anchor="end" fill="#7891ae" font-size="12">source: primitive-platform-waterfalls.v1.json</text></g>

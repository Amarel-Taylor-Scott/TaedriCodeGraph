  </g>
  <g transform="translate(54 532)" filter="url(#shadow)">
    <rect width="1092" height="72" rx="14" fill="#112842"/><text class="label" x="20" y="29">Source to primitive</text><text class="detail" x="20" y="51">discover → acquire → extract → describe → non-public candidate</text><text class="status" x="1048" y="43" text-anchor="end">WORKING CANDIDATE PATH</text>
    <line class="line" x1="480" y1="36" x2="884" y2="36"/><g transform="translate(500 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">1</text></g><g transform="translate(590 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">2</text></g><g transform="translate(680 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">3</text></g><g transform="translate(770 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">4</text></g><g transform="translate(860 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">5</text></g>
  </g>
  <g transform="translate(54 614)" filter="url(#shadow)">
    <rect width="1092" height="72" rx="14" fill="#112842"/><text class="label" x="20" y="29">Matched benchmark</text><text class="detail" x="20" y="51">freeze → validate supplied receipts → paired analysis → claim gate</text><text class="status" x="1048" y="43" text-anchor="end">CONFORMANCE ONLY</text>
    <line class="line" x1="480" y1="36" x2="884" y2="36"/><g transform="translate(520 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">1</text></g><g transform="translate(630 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">2</text></g><g transform="translate(740 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">3</text></g><g transform="translate(850 36)"><circle r="18" fill="#26cf91"/><text class="num" y="5">4</text></g>

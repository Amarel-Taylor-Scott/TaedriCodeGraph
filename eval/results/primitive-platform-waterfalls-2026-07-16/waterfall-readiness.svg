<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Taedri primitive-platform waterfall readiness</title>
  <desc id="desc">Seven waterfalls showing implemented local stages and externally gated stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/><stop offset="1" stop-color="#15233a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      .label{font:700 17px system-ui,sans-serif;fill:#f4f8ff}.detail{font:13px system-ui,sans-serif;fill:#a8bad0}
      .num{font:800 14px system-ui,sans-serif;fill:#06251c;text-anchor:middle}.gate{font:800 14px system-ui,sans-serif;fill:#3c2700;text-anchor:middle}
      .status{font:700 12px ui-monospace,monospace;fill:#88a0bb}.line{stroke:#36506e;stroke-width:4;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1200" height="760" rx="26" fill="url(#bg)"/>
  <text x="54" y="55" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="29" font-weight="800">Seven policy-specific waterfalls · one receipt contract</text>
  <text x="54" y="84" fill="#9fb3ca" font-family="system-ui,sans-serif" font-size="15">Green stages have executable local/library evidence. Amber stages require external systems or independent verification.</text>


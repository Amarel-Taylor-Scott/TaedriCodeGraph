name: taedri-codegraph

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - serve
      - --production
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --control
      - /data/control.sqlite
      - --cors-origin
      - http://localhost:8080
      - --cors-origin
      - http://localhost:8081
    ports:
      - "8000:8000"
    volumes:
      - taedri-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - worker
      - run
      - --control
      - /data/control.sqlite
      - --source-root
      - /sources
      - --worker-id
      - compose-worker
    volumes:
      - taedri-data:/data
      - .:/sources/taedri-codegraph:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/explorer/Dockerfile
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    ports:
      - "8081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taedri-data:

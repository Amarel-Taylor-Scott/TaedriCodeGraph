name: CI

on:
  pull_request:
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install '.[server,agents]'
      - name: Compile all source and tests
        run: python -m compileall -q src tests
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
      - name: Validate fail-closed token evidence without provider calls
        run: |
          python tools/prove_token_savings.py fixtures/token-savings/synthetic-conformance.json --compact --output /tmp/synthetic-proof.json
          python tools/prove_token_savings.py fixtures/token-savings/reported-historical-137485-to-85954.json --compact --output /tmp/historical-proof.json
          python tools/prove_token_savings.py --campaign eval/results/prompt-interception-live-pilot-2026-07-16/mistral-small-2603-k4-seed0.campaign.json --compact --output /tmp/legacy-live-measurement.json
          for campaign in eval/results/prompt-interception-live-v2-2026-07-16/mistral-*.campaign.json; do
            python tools/prove_token_savings.py --campaign "$campaign" --compact --output "/tmp/$(basename "${campaign%.campaign.json}").measurement.json"
          done
      - name: Reproduce live campaign summary
        run: |
          python tools/summarize_prompt_interception_evidence.py eval/results/prompt-interception-live-pilot-2026-07-16/*.campaign.json --summary /tmp/prompt-summary.json --csv /tmp/prompt-summary.csv
          cmp /tmp/prompt-summary.json eval/results/prompt-interception-live-pilot-2026-07-16/summary.json
          cmp /tmp/prompt-summary.csv eval/results/prompt-interception-live-pilot-2026-07-16/summary.csv
          python tools/summarize_prompt_interception_evidence.py eval/results/prompt-interception-live-v2-2026-07-16/*.campaign.json --summary /tmp/prompt-v2-summary.json --csv /tmp/prompt-v2-summary.csv
          cmp /tmp/prompt-v2-summary.json eval/results/prompt-interception-live-v2-2026-07-16/summary.json
          cmp /tmp/prompt-v2-summary.csv eval/results/prompt-interception-live-v2-2026-07-16/summary.csv
      - name: Smoke production HTTP server over a real socket
        run: python tools/smoke_production_server.py
      - name: Validate component readiness inventory
        run: tcg components --root .

  postgres-contract:
    name: PostgreSQL DDL contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taedri
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: taedri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taedri -d taedri_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Apply control-plane DDL twice
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h 127.0.0.1 -U taedri -d taedri_test -v ON_ERROR_STOP=1 -f deploy/postgres/001_control_plane.sql
          psql -h 127.0.0.1 -U taedri -d taedri_test -v ON_ERROR_STOP=1 -f deploy/postgres/002_representation_ledger.sql
          psql -h 127.0.0.1 -U taedri -d taedri_test -v ON_ERROR_STOP=1 -f deploy/postgres/001_control_plane.sql
          psql -h 127.0.0.1 -U taedri -d taedri_test -v ON_ERROR_STOP=1 -f deploy/postgres/002_representation_ledger.sql
      - name: Verify declared tables
        env:
          PGPASSWORD: test-only-password
        run: |
          test "$(psql -h 127.0.0.1 -U taedri -d taedri_test -Atc "select count(*) from pg_tables where schemaname='taedri'")" = "44"

  containers:
    name: Container builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build API and worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: taedri-codegraph:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build explorer image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/explorer/Dockerfile
          push: false
          tags: taedri-explorer:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
